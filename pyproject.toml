[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-manager-studio"
version = "0.1.0"
description = "Simulador de Dirección Técnica de Fútbol: núcleo de gestión, motor de partidos y sistema de vestuario."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Poyopoyo88" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
pro-manager = "pro_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pro_manager = [
    "infraestructura/datos/*.json",
    "presentacion/web/*.html",
    "presentacion/web/static/*",
]

# ----------------------------------------------------------------- Pruebas
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["rendimiento: requisito de calidad de rendimiento del motor de simulación"]

[tool.coverage.run]
source = ["pro_manager"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ----------------------------------------------------------------- Estilo
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI usa Depends() como valor por defecto

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
